name: Build & upload the debug package
# Trigger on every tag creation
on:
  push:
    branches:
      - 'develop'
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
permissions:
  contents: write
concurrency:
  group: publish-maven-branch
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/caches
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-macos-*
          key: ${{ runner.os }}-konan-${{ hashFiles('**/Dependencies.kt') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Update local properties
        env:
          PUBLISH_VERSION: 4.0.${{ github.run_number }}
        run: echo PUBLISH_VERSION=$PUBLISH_VERSION > ./local.properties

      - name: Build and publish to the maven branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./gradlew :coreapp:publishAllPublicationsToMavenBranchRepository
          rm -rf "$RUNNER_TEMP/maven" && mkdir -p "$RUNNER_TEMP/maven"
          if git fetch --depth 1 origin maven; then
            git --work-tree="$RUNNER_TEMP/maven" checkout origin/maven -- .
            git reset -q
          fi
          cp -R coreapp/build/maven-branch/. "$RUNNER_TEMP/maven/"
          cd "$RUNNER_TEMP/maven"
          git init -q
          git checkout -q --orphan maven
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Publish $(cat "$GITHUB_WORKSPACE/local.properties")"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" maven:maven
