name: Compile check
on:
  pull_request:
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/caches
            ~/.konan/dependencies
            ~/.konan/kotlin-native-prebuilt-macos-*
          key: ${{ runner.os }}-konan-${{ hashFiles('**/Dependencies.kt') }}
          restore-keys: |
            ${{ runner.os }}-konan-
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock', '**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - name: Give the build a version
        run: echo PUBLISH_VERSION=0.0.0-pr > ./local.properties
      - name: Compile shared, Android and iOS
        run: ./gradlew :coreapp:compileCommonMainKotlinMetadata :coreapp:compileDebugKotlinAndroid :coreapp:compileKotlinIosArm64 :coreapp:compileKotlinIosSimulatorArm64 --no-daemon
